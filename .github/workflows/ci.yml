# PR gate: format, lint, and test the Rust core.
name: ci

on:
  push:
    branches: [feat/v2]
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test -p ultracontext

      - name: test CLI
        run: cargo test -p ultracontext-cli

      - name: check python native binding
        run: cargo check -p ultracontext-python-native

  js-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install dependencies
        run: npm ci --prefix sdks/js

      - name: build native SDK
        run: npm run build:native --prefix sdks/js

      - name: test remote SDK
        run: npm test --prefix sdks/js

      - name: pack JS package
        run: npm pack --pack-destination /tmp
        working-directory: sdks/js

      - name: install packed JS package
        run: |
          mkdir -p /tmp/uc-js-install
          cd /tmp/uc-js-install
          npm init -y
          npm install /tmp/ultracontext-2.0.0-alpha.0.tgz
          node --input-type=module -e "import { UltraContext } from 'ultracontext'; import { createLocalDirContentStore } from 'ultracontext/content-store'; import { materializeContext } from 'ultracontext/materialize'; console.log(typeof UltraContext, typeof createLocalDirContentStore, typeof materializeContext)"

  python-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: create test venv
        run: python -m venv .venv
        working-directory: sdks/python

      - name: install maturin
        run: .venv/bin/python -m pip install maturin
        working-directory: sdks/python

      - name: install native extension for tests
        run: .venv/bin/maturin develop
        working-directory: sdks/python

      - name: test SDK
        run: .venv/bin/python -m unittest discover -s tests
        working-directory: sdks/python

      - name: build Python wheel
        run: .venv/bin/maturin build --out dist
        working-directory: sdks/python

      - name: install built Python wheel
        run: |
          python -m venv /tmp/uc-python-install
          /tmp/uc-python-install/bin/python -m pip install sdks/python/dist/*.whl
          /tmp/uc-python-install/bin/python -c "from ultracontext import UltraContext; uc=UltraContext(mode='local', path='/tmp/uc-python-install/smoke.db'); ctx=uc.create(metadata={'app':'ci'}); assert uc.export_snapshot()['cursor']; print(UltraContext.__name__)"

  js-prebuilds:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install dependencies
        run: npm ci --prefix sdks/js

      - name: build native prebuild
        run: npm run build:native --prefix sdks/js

      - name: upload native prebuild
        uses: actions/upload-artifact@v4
        with:
          name: ultracontext-js-native-${{ matrix.os }}
          path: |
            sdks/js/native/index.*.node
            sdks/js/ultracontext.*.node
          if-no-files-found: error

  python-wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install maturin
        run: python -m pip install maturin

      - name: build wheel
        run: python -m maturin build --out dist
        working-directory: sdks/python

      - name: upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ultracontext-python-wheel-${{ matrix.os }}
          path: sdks/python/dist/*.whl
          if-no-files-found: error
