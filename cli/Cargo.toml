[package]
name = "ultracontext-cli"
version = "2.0.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "Command-line interface for UltraContext"
repository = "https://github.com/ultracontext/ultracontext"

[[bin]]
name = "uc"
path = "src/main.rs"

[features]
default = []
fuse = ["dep:fuser"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
byteorder = "1.5"
filetime = "0.2"
libc = "0.2"
num-derive = "0.4"
num-traits = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tracing = "0.1"
ultracontext = { path = "../core" }
fuser = { version = "0.15", optional = true }
