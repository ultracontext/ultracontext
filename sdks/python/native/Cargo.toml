[package]
name = "ultracontext-python-native"
version = "2.0.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "Python native binding for UltraContext"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.5", features = ["abi3-py310", "extension-module"] }
serde_json = "1"
ultracontext = { path = "../../../core" }
