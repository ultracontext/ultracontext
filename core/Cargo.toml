[package]
name = "ultracontext"
version = "2.0.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "The context SDK for AI"
repository = "https://github.com/ultracontext/ultracontext"

# sqlite is the default storage block; core stays portable without it (wasm later)
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
