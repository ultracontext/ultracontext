[package]
name = "ultracontext-js-native"
version = "2.0.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "Node native binding for UltraContext"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde_json = "1"
ultracontext = { path = "../engine" }

[build-dependencies]
napi-build = "2"
