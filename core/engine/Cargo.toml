[package]
name = "ultracontext"
version = "2.0.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "The context SDK for AI"
repository = "https://github.com/ultracontext/ultracontext"

[dependencies]
base64 = "0.22"
hmac = "0.12"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
url = "2"
